<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Subscription Value">
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#1f2937"/>
  <!-- meter arc: the provider's quota gauge -->
  <path d="M28 84 A36 36 0 0 1 100 84" fill="none" stroke="#4b5563" stroke-width="10" stroke-linecap="round"/>
  <path d="M28 84 A36 36 0 0 1 78 50" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
  <!-- dollar mark: what the gauge is worth -->
  <text x="64" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="700" fill="#f9fafb">$</text>
</svg>
